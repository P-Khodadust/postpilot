[project]
name = "postpilot"
version = "0.1.0"
description = "PostPilot - Telegram-bot SaaS for scheduled X (Twitter) posting via the official X API."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "PostPilot" }]

dependencies = [
    "aiogram>=3.13,<4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "httpx[http2]>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "cryptography>=44.0",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "tenacity>=9.0",
    "structlog>=24.4",
    "apscheduler>=3.11",
    "jinja2>=3.1",
    "python-multipart>=0.0.17",
    "anthropic>=0.40",
    "stripe>=11.0",
    "babel>=2.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "testcontainers[postgres,redis]>=4.8",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-redis",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/postpilot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["src/postpilot"]
omit = ["*/migrations/*", "*/alembic/*"]
