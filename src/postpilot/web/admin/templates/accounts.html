{% extends "base.html" %}
{% block content %}
<h1>Accounts</h1>
<table>
  <thead><tr><th>Name</th><th>Status</th><th>Timezone</th><th>Created</th></tr></thead>
  <tbody>
    {% for a in accounts %}
    <tr>
      <td>{{ a.name }}</td>
      <td>{{ a.status }}</td>
      <td>{{ a.default_timezone }}</td>
      <td>{{ a.created_at.strftime('%Y-%m-%d') }}</td>
    </tr>
    {% else %}
    <tr><td colspan="4">No accounts yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
